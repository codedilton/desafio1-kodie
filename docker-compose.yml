version: "3.8"

services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    container_name: classificacao-api
    ports:
      - "8000:8000"
    env_file:
      - api/.env
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  n8n:
    image: n8nio/n8n:latest
    container_name: classificacao-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - API_BASE_URL=http://api:8000
      - N8N_BASIC_AUTH_ACTIVE=false
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  n8n_data:
